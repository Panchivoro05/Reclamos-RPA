# Servicios de infraestructura para desarrollo.
# Uso (desde la raíz): docker compose -f infra/compose.yml up -d
# Los puertos se publican solo en 127.0.0.1: Docker se salta las reglas de firewalld.
name: reclamos-rpa

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reclamos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reclamos_dev}
      POSTGRES_DB: ${POSTGRES_DB:-reclamos}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Worker de Celery + bot RPA (oculto). No arranca por defecto:
  #   docker compose -f infra/compose.yml --profile worker up -d --build
  # Para la demo con el navegador visible, ejecuta el worker directo en Fedora (ver README).
  worker:
    profiles: [worker]
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
      args:
        # Tu usuario de Fedora (id -u / id -g): así la evidencia queda a tu nombre.
        UID: ${WORKER_UID:-1000}
        GID: ${WORKER_GID:-1000}
    image: reclamos-rpa-worker
    restart: unless-stopped
    # Red del host: llega a PostgreSQL, Valkey y SISCAJA en 127.0.0.1 sin exponer nada nuevo.
    network_mode: host
    env_file:
      - path: ../.env
        required: false
    environment:
      UPLOAD_DIR: /app/uploads
      BOT_VISIBLE: "false"
    volumes:
      # La evidencia del bot queda donde la API la sirve (backend/uploads). :Z por SELinux.
      - ../backend/uploads:/app/uploads:Z
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  pg_data:
  valkey_data:
