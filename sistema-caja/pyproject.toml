[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-caja"
version = "2.3.0"
description = "SISCAJA: sistema de caja antiguo de BurgerYa (Flask + SQLite, sin API)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["caja*"]

[tool.setuptools.package-data]
caja = ["schema.sql", "templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
# N818 pide el sufijo "Error" en las excepciones; en español va primero (ErrorCompensacion).
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
