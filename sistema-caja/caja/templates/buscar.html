{% extends "base.html" %}
{% block titulo %}Buscar pedido{% endblock %}
{% block contenido %}
<fieldset class="ventana angosta">
  <legend>Consulta de pedido</legend>
  {% if error %}<div id="mensaje-error" class="error">{{ error }}</div>{% endif %}
  <form id="form-buscar" method="get" action="{{ url_for('caja.buscar_pedido') }}">
    <table class="formulario">
      <tr>
        <td><label for="buscar-codigo">Codigo de pedido:</label></td>
        <td><input id="buscar-codigo" name="codigo" type="text" value="{{ codigo }}" placeholder="BY-000000" autocomplete="off" required></td>
        <td><button id="btn-buscar" type="submit">Buscar</button></td>
      </tr>
    </table>
  </form>
</fieldset>
{% endblock %}
