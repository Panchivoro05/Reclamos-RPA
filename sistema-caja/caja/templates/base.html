<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block titulo %}SISCAJA{% endblock %} - SISCAJA v2.3</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='siscaja.css') }}">
</head>
<body>
  <table class="marco" cellspacing="0" cellpadding="0">
    <tr>
      <td class="barra-titulo">
        <span class="logo">SISCAJA v2.3</span>
        <span class="empresa">BurgerYa S.A.C. - Sistema de Caja y Compensaciones</span>
      </td>
    </tr>
    {% if g.operador %}
    <tr>
      <td class="barra-menu">
        <a id="menu-buscar" href="{{ url_for('caja.buscar_pedido') }}">[F2] Buscar pedido</a>
        <a id="menu-compensaciones" href="{{ url_for('caja.historial') }}">[F3] Compensaciones</a>
        <span class="operador">
          Operador: <b id="operador-actual">{{ g.operador.usuario }}</b>
          <form id="form-salir" class="en-linea" method="post" action="{{ url_for('caja.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button id="btn-salir" type="submit">Salir</button>
          </form>
        </span>
      </td>
    </tr>
    {% endif %}
    <tr>
      <td class="contenido">
        {% block contenido %}{% endblock %}
      </td>
    </tr>
    <tr>
      <td class="barra-estado">
        Listo &nbsp;|&nbsp; Terminal: CAJA-01 &nbsp;|&nbsp; (c) 2009 Sistemas Integrales del Peru
      </td>
    </tr>
  </table>
</body>
</html>
