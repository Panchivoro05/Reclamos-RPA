[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reclamos-backend"
version = "0.1.0"
description = "API de reclamos de BurgerYa"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "tzdata>=2024.2",
    "alembic>=1.14",
    "python-multipart>=0.0.18",
    "firebase-admin>=6.6",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
# N818 pide el sufijo "Error" en las excepciones; en español va primero (ErrorAPI).
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
